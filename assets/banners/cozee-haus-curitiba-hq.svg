<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 600" width="1600" height="600" role="img" aria-labelledby="title desc">
  <title id="title">Cozee Haus Curitiba</title>
  <desc id="desc">Banner promocional Cozee Haus com hospedagem em Curitiba</desc>
  <defs>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#07111f" stop-opacity=".78"/>
      <stop offset=".48" stop-color="#07111f" stop-opacity=".28"/>
      <stop offset="1" stop-color="#07111f" stop-opacity=".06"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity=".24"/>
    </filter>
  </defs>
  <image href="city-apartment.webp" x="0" y="0" width="1600" height="600" preserveAspectRatio="xMidYMid slice"/>
  <rect x="0" y="0" width="1600" height="600" fill="url(#shade)"/>
  <g filter="url(#shadow)">
    <rect x="88" y="78" width="700" height="444" rx="34" fill="#ffffff" fill-opacity=".93"/>
  </g>
  <text x="140" y="170" font-family="Arial, Helvetica, sans-serif" font-size="74" font-weight="800" fill="#111827">COZEE HAUS</text>
  <text x="142" y="226" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" letter-spacing="4" fill="#7c3aed">CURITIBA</text>
  <text x="142" y="318" font-family="Arial, Helvetica, sans-serif" font-size="45" font-weight="700" fill="#111827">Seu refúgio em Curitiba</text>
  <text x="142" y="370" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="500" fill="#475569">Conforto, localização e praticidade</text>
  <rect x="142" y="414" width="340" height="72" rx="36" fill="#6d28d9"/>
  <text x="312" y="460" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="800" fill="#fff">Conheça no Instagram</text>
  <text x="520" y="458" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#334155">@curitiba.airbnb</text>
</svg>